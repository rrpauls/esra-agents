name: esra-agents
version: 0.3.0
manifest_version: 2
api_version: 1
description: "Guarded autonomous ESRA controller for local agent-owned skills."
author: "Robert Pauls"
license: Apache-2.0
homepage: https://github.com/rrpauls/esra-agents
tags: [esra, autonomous-agents, self-correction, skills]
hooks:
  - post_tool_call
  - post_llm_call
  - on_session_end
  - on_skill_lifecycle
provides_hooks:
  - post_tool_call
  - post_llm_call
  - on_session_end
  - on_skill_lifecycle
provides_tools:
  - esra_controller
config_schema:
  state_dir: {type: str, default: "", description: "Private ESRA controller state directory"}
  agent_id: {type: str, default: "default", description: "Stable local agent identifier"}
