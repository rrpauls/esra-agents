name: Release distributions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach
        required: true
        type: string

permissions:
  contents: write

jobs:
  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate all supported host packages
        run: |
          python3 scripts/build_distributions.py
          python3 scripts/validate_distributions.py dist
          cd dist
          sha256sum -c SHA256SUMS
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
