name: Validate

on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m py_compile runtime/*.py scripts/*.py tests/*.py
      - name: Validate skills and manifests
        run: |
          .venv/bin/python scripts/sync_manifests.py --check
          .venv/bin/python scripts/validate_skills.py
          .venv/bin/python scripts/validate_plugin.py
      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          .venv/bin/python scripts/build_distributions.py
          .venv/bin/python scripts/validate_distributions.py dist
          (cd dist && sha256sum -c SHA256SUMS)
          .venv/bin/python scripts/verify_installations.py
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: esra-agents-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS
